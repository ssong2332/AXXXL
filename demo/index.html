<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>자취 계약 내비</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: sticky top bar, one centered 1120px column per screen; main + aside rows that stack on phones */
:root {
  --bg: #F6F8F7; --surface: #FFFFFF; --fg: #1A1D21; --sub: #4A5058; --muted: #646B73;
  --line: #E4E7EA; --soft: #F1F3F4; --accent: #0A7F5C; --accent-ink: #FFFFFF; --accent-soft: #E6F4EE;
  --accent-text: #0A6E50; --warn: #B83D0A; --warn-soft: #FFF1E8; --warn-ink: #7A2E07;
  --bad: #B42318; --bad-soft: #FDECEA; --stage: #EEF2F0; --shadow: rgba(16,40,30,0.10);
  --demo: #1A1D21; --demo-ink: #FFFFFF;
  --font: "Noto Sans KR", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111413; --surface: #1A1F1D; --fg: #ECEFEE; --sub: #BAC2BF; --muted: #9AA4A0;
  --line: #2C3331; --soft: #232928; --accent: #2FB386; --accent-ink: #06261B; --accent-soft: #163A2E;
  --accent-text: #5CCBA3; --warn: #FF9A62; --warn-soft: #3A2416; --warn-ink: #FFC9A8;
  --bad: #FF8A80; --bad-soft: #3B1B19; --stage: #1E2523; --shadow: rgba(0,0,0,0.45);
  --demo: #2FB386; --demo-ink: #06261B; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111413; --surface: #1A1F1D; --fg: #ECEFEE; --sub: #BAC2BF; --muted: #9AA4A0;
  --line: #2C3331; --soft: #232928; --accent: #2FB386; --accent-ink: #06261B; --accent-soft: #163A2E;
  --accent-text: #5CCBA3; --warn: #FF9A62; --warn-soft: #3A2416; --warn-ink: #FFC9A8;
  --bad: #FF8A80; --bad-soft: #3B1B19; --stage: #1E2523; --shadow: rgba(0,0,0,0.45);
  --demo: #2FB386; --demo-ink: #06261B; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.55; letter-spacing: -0.01em; font-variant-numeric: tabular-nums }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
a { color: var(--accent-text) }
h1, h2, h3 { text-wrap: balance; margin: 0; letter-spacing: -0.03em }
p { margin: 0 }
button, input, select { font: inherit; color: inherit }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

.demo-bar { background: var(--demo); color: var(--demo-ink); font-size: 13px }
.demo-bar .wrap { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; justify-content: space-between; padding-block: 8px }
.demo-bar a { color: var(--demo-ink); font-weight: 700 }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line) }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 24px; min-height: 60px }
.logo { display: flex; align-items: center; gap: 10px; min-height: 60px; font-weight: 800; font-size: 18px; color: var(--fg); text-decoration: none; letter-spacing: -0.03em }
.logo-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); display: inline-flex; align-items: center; justify-content: center }
.logo-mark svg { stroke: var(--accent-ink) }
.nav { display: flex; flex-wrap: wrap; gap: 0 20px }
.nav a { display: inline-flex; align-items: center; min-height: 52px; color: var(--sub); text-decoration: none; font-size: 15px }
.nav a[aria-current="page"] { color: var(--fg); font-weight: 700; box-shadow: inset 0 -2px 0 var(--accent) }

main { padding-block: 36px 72px; min-height: 60vh }
.stack { display: flex; flex-direction: column; gap: 20px }
.row { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start }
.col-main { flex: 999 1 540px; min-width: 0; display: flex; flex-direction: column; gap: 20px }
.col-side { flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px }
.card { background: var(--surface); border-radius: 20px; padding: 24px }
.card h2 { font-size: 19px; font-weight: 800 }
.eyebrow { font-size: 14px; color: var(--sub) }
.page-title { font-size: clamp(26px, 4vw, 36px); font-weight: 800; line-height: 1.3 }
.muted { color: var(--muted) }
.small { font-size: 13px }
.hl { color: var(--accent-text) }
.between { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 24px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-size: 16px; font-weight: 700; text-decoration: none; cursor: pointer }
.btn:hover { filter: brightness(1.06) }
.btn-soft { background: var(--soft); color: var(--fg) }
.btn-line { background: var(--surface); color: var(--fg); border: 1px solid var(--line) }
.btn-sm { min-height: 40px; padding: 0 14px; border-radius: 10px; font-size: 14px }
.btn-block { width: 100% }
.link-sm { font-size: 13px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px }

.tag { display: inline-flex; align-items: center; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--soft); color: var(--sub); white-space: nowrap }
.tag.ok { background: var(--accent-soft); color: var(--accent-text) }
.tag.warn { background: var(--warn-soft); color: var(--warn) }
.tag.bad { background: var(--bad-soft); color: var(--bad) }
.tag.solid { background: var(--accent); color: var(--accent-ink) }

.notice { display: flex; gap: 10px; align-items: flex-start; border-radius: 14px; padding: 14px 16px; font-size: 15px }
.notice.warn { background: var(--warn-soft); color: var(--warn-ink) }
.notice.ok { background: var(--accent-soft); color: var(--accent-text) }
.notice.info { background: var(--soft); color: var(--sub) }

.list-row { display: flex; align-items: center; gap: 14px; padding: 15px 0; border-top: 1px solid var(--line) }
.list-row:first-of-type { border-top: 0 }
.icon-box { width: 44px; height: 44px; flex: 0 0 auto; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; background: var(--soft) }
.icon-box.warn { background: var(--warn-soft) }

/* home */
.hero { background: var(--surface); border-radius: 28px; display: flex; flex-wrap: wrap; gap: 40px; align-items: center; padding: clamp(28px, 5vw, 56px) clamp(20px, 4vw, 48px) }
.hero h1 { font-size: clamp(32px, 5vw, 48px); font-weight: 800; line-height: 1.22; letter-spacing: -0.04em }
.hero-copy { flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 22px; align-items: flex-start }
.hero-card { flex: 1 1 380px; min-width: 0; max-width: 460px; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; box-shadow: 0 24px 48px var(--shadow); padding: 26px; display: flex; flex-direction: column; gap: 16px }
.stages { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px }
.stages li { background: var(--surface); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 8px }
.stages b { font-size: 16px; line-height: 1.45 }
.stage-no { font-size: 13px; font-weight: 700; color: var(--accent-text) }
.dark-band { background: var(--fg); color: var(--bg); border-radius: 24px; padding: 36px; display: flex; flex-wrap: wrap; gap: 24px; align-items: center; justify-content: space-between }
.dark-band a { display: inline-flex; flex-direction: column; justify-content: center; min-height: 60px; padding: 0 18px; border-radius: 14px; background: color-mix(in srgb, var(--bg) 14%, var(--fg)); color: var(--bg); text-decoration: none }

/* input */
.progress { height: 3px; background: var(--line) }
.progress span { display: block; height: 100%; background: var(--accent); transition: width .3s }
.field { display: flex; flex-direction: column; gap: 8px }
.field > span:first-child { font-size: 15px; color: var(--sub) }
.big-input { display: flex; align-items: baseline; gap: 8px; border-bottom: 2px solid var(--fg); padding: 6px 0 10px }
.big-input:focus-within { border-color: var(--accent) }
.big-input input { flex: 1 1 auto; min-width: 0; border: 0; outline: none; background: transparent; font-size: 32px; font-weight: 700 }
.big-input em { font-style: normal; font-size: 20px; font-weight: 600; color: var(--sub) }
.select, .date { min-height: 54px; border: 1px solid var(--line); border-radius: 14px; padding: 0 14px; font-size: 17px; background: var(--surface) }
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.chip { min-height: 46px; padding: 0 18px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; font-size: 15px; cursor: pointer }
.chip[aria-pressed="true"] { border: 2px solid var(--accent); background: var(--accent-soft); color: var(--accent-text); font-weight: 700; padding: 0 17px }
.radio-card { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 58px; border: 1px solid var(--line); border-radius: 14px; padding: 0 18px; font-size: 16px; cursor: pointer; background: var(--surface) }
.radio-card:has(input:checked) { border: 2px solid var(--accent); background: var(--accent-soft); font-weight: 700; padding: 0 17px }
.radio-card input { width: 22px; height: 22px; accent-color: var(--accent) }
.sum-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px }

/* timeline */
.task { display: flex; gap: 14px; align-items: flex-start; padding: 16px 0; border-top: 1px solid var(--line) }
.task input[type=checkbox] { width: 24px; height: 24px; margin: 0; flex: 0 0 auto; accent-color: var(--accent); cursor: pointer }
.task label { font-size: 16px; font-weight: 700; cursor: pointer }
.task.done label { text-decoration: line-through; color: var(--muted) }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden }
.bar span { display: block; height: 100%; background: var(--accent) }
.side-nav a { display: flex; justify-content: space-between; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 10px; color: var(--fg); text-decoration: none }
.side-nav a:hover { background: var(--soft) }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 46px; cursor: pointer }
.switch-row input { width: 22px; height: 22px; accent-color: var(--accent) }

/* detail */
.cond { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line) }
.cond:first-of-type { border-top: 0 }
.mark { width: 28px; height: 28px; flex: 0 0 auto; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px }
.mark.ok { background: var(--accent-soft); color: var(--accent-text) }
.mark.bad { background: var(--bad-soft); color: var(--bad) }
.mark.q { background: var(--warn-soft); color: var(--warn) }
.doc-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 54px; padding: 0 16px; border-radius: 14px; background: var(--soft) }
.doc-row.missing { background: transparent; border: 1px dashed var(--line) }

/* docs */
.doc-item { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px; border: 0; border-radius: 14px; background: transparent; cursor: pointer }
.doc-item[aria-pressed="true"] { background: var(--accent-soft) }
.thumb { width: 42px; height: 54px; flex: 0 0 auto; border-radius: 6px; background: var(--soft); border: 1px solid var(--line) }
.paper { flex: 1 1 220px; min-width: 0; min-height: 280px; border: 1px solid var(--line); border-radius: 12px; background: var(--soft); padding: 20px; display: flex; flex-direction: column; gap: 10px; font-size: 12px; color: var(--sub) }
.paper i { display: block; height: 6px; border-radius: 2px; background: var(--line) }
.paper s { display: inline-block; height: 12px; width: 90px; background: var(--fg); border-radius: 2px; text-decoration: none }
dl.kv { margin: 0; flex: 1 1 260px; min-width: 0 }
dl.kv div { display: flex; justify-content: space-between; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line) }
dl.kv div:first-child { border-top: 0 }
dl.kv dt { color: var(--muted) } dl.kv dd { margin: 0; font-weight: 600; text-align: right }

/* room */
.viewport { position: relative; height: 560px; border-radius: 16px; background: var(--stage); overflow: hidden; perspective: 1900px; perspective-origin: 50% 35%; display: flex; align-items: center; justify-content: center }
.scene { position: relative; transform-style: preserve-3d; transition: transform .6s ease }
.scene > div { position: absolute }
.face-top { display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #3A4048; box-shadow: inset 0 0 0 1px rgba(0,0,0,.05) }
.seg { display: flex; padding: 4px; background: var(--soft); border-radius: 12px }
.seg button { min-height: 40px; padding: 0 18px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 700; cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px var(--shadow) }
.icon-btn { width: 44px; height: 44px; border: 0; border-radius: 12px; background: var(--soft); cursor: pointer; display: inline-flex; align-items: center; justify-content: center }
.icon-btn svg { stroke: var(--fg) }
.bed-opt { flex: 1 1 0; min-width: 0; min-height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; cursor: pointer }
.bed-opt[aria-pressed="true"] { border: 2px solid var(--accent); background: var(--accent-soft) }
input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; margin: 0 }
.stat { flex: 1 1 160px; min-width: 0; background: var(--surface); border-radius: 16px; padding: 16px 20px; display: flex; flex-direction: column; gap: 2px }
.stat b { font-size: 22px; font-weight: 800 }

/* admin */
.admin-shell { display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch }
.source-text { flex: 1 1 380px; min-width: 0; max-height: 620px; overflow-y: auto; font-size: 14px; line-height: 1.85; color: var(--sub) }
.source-text b { color: var(--fg) }
mark { background: var(--accent-soft); color: var(--fg); padding: 1px 3px; border-radius: 3px }
mark.chg { background: var(--warn-soft) }
.tbl-wrap { overflow-x: auto }
table { width: 100%; min-width: 480px; border-collapse: collapse; font-size: 14px }
th, td { padding: 10px 12px; border-top: 1px solid var(--line); text-align: left; vertical-align: top }
thead th { color: var(--muted); font-weight: 600; font-size: 13px; border-top: 0 }
tr.changed { background: var(--warn-soft) }
td input { width: 100%; min-height: 40px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; background: var(--surface) }

footer { border-top: 1px solid var(--line); background: var(--surface) }
footer .wrap { padding-block: 28px 36px; display: flex; flex-direction: column; gap: 12px; font-size: 13px; color: var(--muted) }
footer nav { display: flex; flex-wrap: wrap; gap: 4px 18px }
footer nav a { color: var(--sub); text-decoration: none; font-weight: 600 }

#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 20; max-width: calc(100% - 32px) }
@media (prefers-reduced-motion: reduce) { .scene, .progress span { transition: none } }
</style>

</head>
<body>
<div class="demo-bar"><div class="wrap"><span>시연 버전이에요. 서울 청년 주거지원 공고(2026.10.28 기준) 예시 데이터로 동작해요.</span><span><a href="app.html">계약 후 화면 보기</a> · <a href="admin.html">운영자 콘솔(공고 검수·AI 코치)</a></span></div></div>

<header class="top"><div class="wrap">
  <a class="logo" href="#home"><span class="logo-mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10v9h11v-9"/><path d="M10.5 19v-4.5h3V19"/></svg></span>자취 계약 내비</a>
  <nav class="nav" aria-label="주요 메뉴">
    <a href="#input" data-nav="input">조건 입력</a>
    <a href="#result" data-nav="result">확인 결과</a>
    <a href="#timeline" data-nav="timeline">내 타임라인</a>
    <a href="#docs" data-nav="docs">서류함</a>
  </nav>
</div></header>

<main id="app" class="wrap" tabindex="-1"></main>

<footer><div class="wrap">
  <nav aria-label="시연 화면 바로가기">
    <a href="#home">홈</a><a href="#input">조건 입력</a><a href="#result">확인 결과</a><a href="#timeline">타임라인</a><a href="#detail-rent">지원 상세</a><a href="#docs">서류함</a><a href="#room">방 크기 미리보기</a><a href="#admin">관리자 · 공고 검수</a>
  </nav>
  <p>자취 계약 내비는 법률 자문이나 권리분석을 대신하지 않아요. 지원 자격은 각 기관 심사로 최종 결정돼요.<br>데이터 출처: 온통청년(한국고용정보원), 서울주거포털, 국토교통부, 행정표준코드관리시스템</p>
</div></footer>

<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  'use strict';
  var GU = ['강남구','강동구','강북구','강서구','관악구','광진구','구로구','금천구','노원구','도봉구','동대문구','동작구','마포구','서대문구','서초구','성동구','성북구','송파구','양천구','영등포구','용산구','은평구','종로구','중구','중랑구'];
  var POPULAR = ['관악구','동작구','광진구','마포구','동대문구','성북구','서대문구'];
  var BASIS = '2026.10.28';
  var DEFAULT = { gu: '관악구', deposit: 1000, rent: 55, age: 24, income: '150', contract: '2026-11-14', move: '2026-12-01',
    done: { t1: true, t2: true }, step: 1, bed: 'ss', w: 3.2, d: 4.0, desk: true, wardrobe: true, fridge: true, view: '3d', rz: 40,
    doc: 'contract', extraDocs: [], approved: '' };
  var S = JSON.parse(JSON.stringify(DEFAULT));
  try { var saved = JSON.parse(localStorage.getItem('jachwi-demo') || 'null'); if (saved) Object.assign(S, saved); } catch (e) {}
  function save() { try { localStorage.setItem('jachwi-demo', JSON.stringify(S)); } catch (e) {} }

  var app = document.getElementById('app');
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function won(n) { return n.toLocaleString('ko-KR'); }

  // ---------- dates ----------
  var WD = ['일','월','화','수','목','금','토'];
  function pd(s) { var p = String(s || '').split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2]); return isNaN(d) ? new Date() : d; }
  function add(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  // n개월 앞뒤 같은 날, 없으면 말일 (민법 제160조 · engine.js addMonths와 같은 계산)
  function addMonths(d, n) { var m = d.getMonth() + n, y = d.getFullYear() + Math.floor(m / 12), mm = ((m % 12) + 12) % 12; return new Date(y, mm, Math.min(d.getDate(), new Date(y, mm + 1, 0).getDate())); }
  function md(d) { return (d.getMonth() + 1) + '.' + d.getDate() + '(' + WD[d.getDay()] + ')'; }
  function ymd(d) { return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0'); }
  var today = new Date(); today.setHours(0, 0, 0, 0);
  function dday(d) { var n = Math.round((d - today) / 86400000); return n > 0 ? 'D-' + n : (n === 0 ? 'D-day' : (-n) + '일 지남'); }

      '<div class="row" style="gap:10px"><a href="https://www.khug.or.kr" target="_blank" rel="noopener"><b>안심전세 앱 ↗</b><span class="small" style="opacity:.75">주택도시보증공사</span></a><a href="https://news.seoul.go.kr/welfare/archives/577727" target="_blank" rel="noopener"><b>전월세 안심계약 도움서비스 ↗</b><span class="small" style="opacity:.75">서울시 1인가구지원과</span></a></div></div></section>';
  }

  function viewInput() {
    var step = S.step, body = '';
    if (step === 1) {
      body = '<h1 class="page-title">계약하려는 집이<br>어느 구에 있나요?</h1>' +
        '<label class="field"><span>시·군·구</span><select id="f-gu" class="select" data-field="gu">' + GU.map(function (g) { return '<option' + (g === S.gu ? ' selected' : '') + '>' + g + '</option>'; }).join('') + '</select></label>' +
        '<div class="stack" style="gap:10px"><span class="small muted">청년 1인가구가 많이 사는 곳</span><div class="chips">' + POPULAR.map(function (g) { return '<button type="button" class="chip" data-act="gu" data-v="' + g + '" aria-pressed="' + (g === S.gu) + '">' + g + '</button>'; }).join('') + '</div></div>' +
        '<p class="small muted">첫 버전은 서울 25개 구만 지원해요 · 법정동코드 기준</p>';
    } else if (step === 2) {
      body = '<h1 class="page-title">보증금과 월세를<br>알려주세요</h1>' +
        '<label class="field"><span>보증금</span><span class="big-input"><input id="f-deposit" inputmode="numeric" data-field="deposit" data-num value="' + S.deposit + '"><em>만 원</em></span></label>' +
        '<label class="field"><span>월세 (관리비 제외)</span><span class="big-input"><input id="f-rent" inputmode="numeric" data-field="rent" data-num value="' + S.rent + '"><em>만 원</em></span></label>' +
        '<div id="hint"></div>';
    } else if (step === 3) {
      body = '<h1 class="page-title">나이와 소득 구간을<br>골라주세요</h1>' +
        '<label class="field" style="max-width:220px"><span>만 나이</span><span class="big-input"><input id="f-age" inputmode="numeric" data-field="age" data-num value="' + S.age + '"><em>세</em></span></label>' +
        '<fieldset style="border:0;margin:0;padding:0" class="stack"><legend class="muted" style="margin-bottom:10px">가구 소득 (기준 중위소득 대비)</legend>' +
        [['100', '100% 이하'], ['150', '100% 초과 ~ 150% 이하'], ['over', '150% 초과'], ['unknown', '잘 모르겠어요']].map(function (o) { return '<label class="radio-card"><span>' + o[1] + '</span><input type="radio" name="income" data-field="income" value="' + o[0] + '"' + (S.income === o[0] ? ' checked' : '') + '></label>'; }).join('') +
        '</fieldset><p class="small muted">잘 모르면 ‘잘 모르겠어요’를 골라도 돼요. 소득 조건은 결과에서 확인 필요로 표시해요.</p>';
    } else {
      body = '<h1 class="page-title">계약일과 전입 예정일을<br>알려주세요</h1>' +
        '<div class="row" style="gap:14px"><label class="field" style="flex:1 1 220px;min-width:0"><span>계약일 (예정)</span><input id="f-contract" type="date" class="date" data-field="contract" value="' + S.contract + '"></label>' +
        '<label class="field" style="flex:1 1 220px;min-width:0"><span>전입 예정일</span><input id="f-move" type="date" class="date" data-field="move" value="' + S.move + '"></label></div>' +
        '<p class="muted">전입신고는 이사 후 14일, 전월세 신고는 계약 후 30일 안에 해야 해요.</p><div id="date-hint"></div>';
    }
    return '<div class="progress" style="margin:0 0 32px;border-radius:2px;overflow:hidden" aria-hidden="true"><span style="width:' + step * 25 + '%"></span></div>' +
      '<div class="row" style="gap:40px"><section class="col-main" style="max-width:620px;gap:28px"><span class="hl" style="font-weight:700">' + step + ' / 4</span>' + body +
      '<div class="row" style="gap:10px">' + (step > 1 ? '<button type="button" class="btn btn-soft" data-act="prev">이전</button>' : '') +
      (step < 4 ? '<button type="button" class="btn" style="flex:1 1 auto" data-act="next">다음</button>' : '<a class="btn" style="flex:1 1 auto" href="#result">결과 보기</a>') + '</div></section>' +
      '<aside class="col-side"><div class="card" style="background:var(--surface)" id="sum"></div><p class="small muted" style="padding:0 8px">입력한 정보는 계산에만 써요. 시연 버전은 이 브라우저에만 임시로 기억해요.</p>' +
      '<button type="button" class="btn btn-line btn-sm" data-act="reset">예시 값으로 되돌리기</button></aside></div>';
  }
  function fillInputSide() {
    var el = document.getElementById('sum'); if (!el) return;
    var rows = [['지역', '서울 ' + S.gu, 1], ['보증금 · 월세', won(S.deposit) + '만 · ' + S.rent + '만 원', 2], ['나이', '만 ' + S.age + '세', 3], ['소득 구간', incomeLabel(), 3], ['계약일', ymd(pd(S.contract)), 4], ['전입 예정일', ymd(pd(S.move)), 4]];
    el.innerHTML = '<b style="display:block;margin-bottom:8px">입력한 조건</b>' + rows.map(function (r) { var cur = r[2] === S.step, past = r[2] < S.step; return '<div class="sum-row"><span class="muted">' + r[0] + '</span><span style="font-weight:' + (past || cur ? 700 : 500) + ';color:' + (cur ? 'var(--accent-text)' : past ? 'var(--fg)' : 'var(--muted)') + '">' + (past || cur ? esc(r[1]) : '—') + '</span></div>'; }).join('');
    var h = document.getElementById('hint');
    if (h) h.innerHTML = (S.deposit > 6000 || S.rent > 30) ? '<div class="notice warn">' + IC.alert + '<span>' + (S.rent > 30 ? '월세가 30만 원을 넘어서' : '보증금이 6천만 원을 넘어서') + ' <b>전월세 신고 대상</b>이에요. 기한은 다음 단계에서 계산해 드릴게요.</span></div>' : '<div class="notice info">보증금 6천만 원 이하, 월세 30만 원 이하라 전월세 신고 대상은 아니에요.</div>';
    var dh = document.getElementById('date-hint');
    if (dh) dh.innerHTML = pd(S.move) < pd(S.contract) ? '<div class="notice warn">' + IC.alert + '<span>전입 예정일이 계약일보다 빨라요. 날짜를 다시 확인해 주세요.</span></div>' : '';
  }

  function viewResult() {
    var R = evaluate(), T = buildTimeline(R), count = 0;
    T.forEach(function (s) { count += s.tasks.length; });
    var first = null; T.forEach(function (s) { s.tasks.forEach(function (t) { if (!first && !S.done[t.id]) first = t; }); });
    var reports = '';
    if (R.report.required) reports += '<div class="list-row"><span class="icon-box warn" style="color:var(--warn)">' + IC.doc + '</span><div style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px"><b style="font-size:17px">전월세 신고</b><span class="small muted">' + R.report.reason + ' · 신고하면 확정일자도 함께 받아요</span><a class="link-sm" href="https://www.law.go.kr" target="_blank" rel="noopener">근거 · 부동산거래신고법 제6조의2</a></div><div style="text-align:right;flex:0 0 auto"><b>' + md(R.report.due) + '까지</b><div class="small" style="color:var(--warn);font-weight:700">' + dday(R.report.due) + '</div></div></div>';
    reports += '<div class="list-row"><span class="icon-box">' + IC.home + '</span><div style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px"><b style="font-size:17px">전입신고</b><span class="small muted">정부24 또는 행정복지센터 · 대항력이 생겨요</span><a class="link-sm" href="https://law.go.kr" target="_blank" rel="noopener">근거 · 주민등록법 제16조</a></div><div style="text-align:right;flex:0 0 auto"><b>' + md(R.movein.due) + '까지</b><div class="small muted">' + dday(R.movein.due) + '</div></div></div>';
    var progs = R.eligible.map(function (x) {
      return '<div style="border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px"><div class="between" style="align-items:flex-start"><div style="flex:999 1 280px;min-width:0;display:flex;flex-direction:column;gap:6px"><div class="row" style="gap:8px;align-items:center"><b style="font-size:18px">' + x.p.name + '</b><span class="tag ' + x.p.statusCls + '">' + x.p.status + '</span>' + (x.p.firstCome ? '<span class="tag warn">선착순 · 일찍 마감될 수 있음</span>' : '') + '</div>' +
        '<span class="small muted">' + x.p.amountText + ' · 신청 기간: ' + x.p.period + '</span>' + (x.unknown.length > 1 || (x.unknown.length && x.unknown[0].label !== '무주택자') ? '<span class="tag warn" style="align-self:flex-start">소득 조건 확인 필요</span>' : '') + '</div><b style="font-size:20px">' + x.p.amount + '만 원</b></div>' +
        '<div class="between" style="border-top:1px solid var(--line);padding-top:10px"><a class="link-sm" href="' + x.p.url + '" target="_blank" rel="noopener">공고 원문 · ' + BASIS + ' 기준</a><a href="#' + x.p.hash + '" style="display:inline-flex;align-items:center;gap:4px;min-height:40px;font-weight:700;text-decoration:none">자세히 보기 ' + IC.chev + '</a></div></div>';
    }).join('') || '<div class="notice info">지금 입력한 조건으로 받을 수 있는 지원이 없어요. 조건이 바뀌면 다시 확인해 보세요.</div>';
    var others = R.others.map(function (o) { return '<div style="display:flex;flex-direction:column;gap:2px"><b>' + o.name + '</b><span class="small muted">' + o.why + '</span></div>'; }).join('');
    return '<div class="stack"><section class="between" style="align-items:flex-end;padding-bottom:8px"><div class="stack" style="gap:8px"><p class="eyebrow">' + condLine() + '</p>' +
      '<h1 class="page-title">' + (R.total ? '지원금 최대 <span class="hl">' + R.total + '만 원</span>을<br>받을 수 있어요' : '받을 수 있는 지원은 없지만<br>꼭 해야 할 신고가 있어요') + '</h1></div><a class="btn btn-line btn-sm" href="#input">조건 바꾸기</a></section>' +
      '<div class="row"><div class="col-main"><section class="card"><div class="between" style="margin-bottom:6px"><h2>꼭 해야 하는 신고 ' + (R.report.required ? 2 : 1) + '건</h2><span class="small muted">안 하면 과태료가 나올 수 있어요</span></div>' + reports + '</section>' +
      '<section class="card stack" style="gap:14px"><div class="between"><h2>받을 수 있는 지원 ' + R.eligible.length + '건</h2><span class="small muted">' + BASIS + ' 공고 기준</span></div>' + progs +
      '<details style="background:var(--soft);border-radius:16px;padding:2px 20px"><summary style="min-height:50px;display:flex;align-items:center;font-weight:600;color:var(--sub);cursor:pointer">해당되지 않는 지원 ' + R.others.length + '건</summary><div class="stack" style="gap:12px;padding-bottom:18px">' + others + '</div></details></section></div>' +
      '<aside class="col-side"><div class="card stack" style="background:var(--accent);color:var(--accent-ink);gap:14px"><span style="opacity:.85">이사 전후로 할 일</span><b style="font-size:30px">' + count + '개</b><span style="opacity:.9">' + (first ? '다음 할 일은 ‘' + first.title + '’이에요.' : '할 일을 모두 끝냈어요.') + '</span><a class="btn btn-block" style="background:var(--surface);color:var(--accent-text)" href="#timeline">타임라인으로 보기</a></div>' + safetyCard() + '</aside></div>' +
      '<p class="small muted">승인된 공고 기준으로 계산한 예상 결과예요. 실제 지원 여부는 기관 심사로 결정되고, 법률 자문을 대신하지 않아요.</p></div>';
  }

  function viewTimeline() {
    var R = evaluate(), T = buildTimeline(R), total = 0, done = 0, urgent = null;
    T.forEach(function (s) { s.tasks.forEach(function (t) { total++; if (S.done[t.id]) done++; else if (t.urgent && t.due && (!urgent || t.due < urgent.due)) urgent = t; }); });
    var pct = Math.round(done / total * 100);
    var stages = T.map(function (s, i) {
      return '<section class="card" id="stage-' + (i + 1) + '" style="padding-bottom:10px"><div class="row" style="gap:6px 12px;align-items:center;padding-bottom:8px"><span class="stage-no">0' + (i + 1) + '</span><h2>' + s.name + '</h2><span class="small muted">' + s.when + '</span>' + (s.now ? '<span class="tag solid">지금 단계</span>' : '') + '</div>' +
        s.tasks.map(function (t) {
          var c = !!S.done[t.id];
          var dueTxt = c ? '완료' : (t.dueText || (md(t.due) + '까지'));
          var cls = c ? 'ok' : (t.urgent ? 'warn' : '');
          var act = t.act && (!c || t.keep) ? '<a class="btn btn-soft btn-sm" href="' + t.act[1] + '"' + (t.act[1].charAt(0) === '#' ? '' : ' target="_blank" rel="noopener"') + '>' + t.act[0] + '</a>' : '';
          var src = /법/.test(t.src) ? '<a class="link-sm" href="https://www.law.go.kr" target="_blank" rel="noopener">근거 · ' + t.src + '</a>' : '<span class="small muted">근거 · ' + t.src + '</span>';
          return '<div class="task' + (c ? ' done' : '') + '"><input type="checkbox" id="chk-' + t.id + '" data-act="task" data-id="' + t.id + '"' + (c ? ' checked' : '') + '><div style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px"><div class="between" style="gap:6px 12px"><label for="chk-' + t.id + '">' + t.title + '</label><span class="tag ' + cls + '">' + dueTxt + (t.due && !c && !t.dueText ? ' · ' + dday(t.due) : '') + '</span></div>' +
            '<span class="muted" style="font-size:14px">' + t.desc + '</span><div class="row" style="gap:6px 16px;align-items:center;margin-top:2px">' + act + src + '</div></div></div>';
        }).join('') + '</section>';
    }).join('');
    return '<div class="stack" style="gap:24px"><section class="between" style="align-items:flex-end"><div class="stack" style="gap:8px"><p class="eyebrow">' + esc(S.gu) + ' · ' + md(R.C) + ' 계약 · ' + md(R.M) + ' 전입</p><h1 class="page-title">내 자취 타임라인</h1></div><a class="btn btn-line btn-sm" href="#alert">' + IC.bell + '기한 알림 켜기</a></section>' +
      '<div class="row"><aside class="col-side" style="flex-basis:280px"><div class="card stack" style="gap:12px"><div class="between"><span class="muted">진행률</span><b>' + done + ' / ' + total + '</b></div><b style="font-size:32px">' + pct + '%</b><div class="bar"><span style="width:' + pct + '%"></span></div></div>' +
      (urgent ? '<div class="card stack" style="gap:8px"><span class="small" style="font-weight:700;color:var(--warn)">가장 급한 기한</span><b style="font-size:18px">' + urgent.title + '</b><span class="muted">' + md(urgent.due) + '까지 · ' + dday(urgent.due) + '</span>' + (urgent.act ? '<a class="btn btn-soft btn-sm" href="' + urgent.act[1] + '" target="_blank" rel="noopener">' + urgent.act[0] + '</a>' : '') + '</div>' : '') +
      '<form class="card stack" id="alert" style="gap:2px" data-form="alert"><b style="margin-bottom:6px">기한 알림</b>' +
      '<label class="switch-row"><span>전입신고 <span class="muted">' + md(R.movein.due) + '</span></span><input type="checkbox" checked></label>' +
      (R.report.required ? '<label class="switch-row"><span>전월세 신고 <span class="muted">' + md(R.report.due) + '</span></span><input type="checkbox" checked></label>' : '') +
      '<label class="switch-row"><span>지원 신청 시작·마감</span><input type="checkbox" checked></label>' +
      '<label class="switch-row"><span>미리 알림</span><select id="f-remind" class="select" style="min-height:40px;font-size:14px"><option>3일 전 오전 9시</option><option>하루 전 오전 9시</option><option>당일 오전 9시</option></select></label>' +
      '<button class="btn btn-sm" style="margin-top:8px" type="submit">이 브라우저로 알림 받기</button><span class="small muted" style="margin-top:6px">선착순 지원은 기간보다 일찍 마감될 수 있어요.</span></form>' +
      '<nav class="card side-nav" style="padding:8px" aria-label="단계 바로가기">' + T.map(function (s, i) { var d = s.tasks.filter(function (t) { return S.done[t.id]; }).length; return '<a href="#stage-' + (i + 1) + '"><span>' + s.name + '</span><span class="small muted">' + d + ' / ' + s.tasks.length + '</span></a>'; }).join('') + '</nav></aside>' +
      '<div class="col-main" style="gap:16px">' + stages + '<p class="small muted">기한은 주민등록법(전입신고 14일), 부동산거래신고법(전월세 신고 30일)과 각 지원 공고 기준으로 계산했어요. 해당하지 않는 항목은 빼고 보여줘요.</p></div></div></div>';
  }

  function viewDetail(id) {
    var R = evaluate(), x = R.programs.filter(function (q) { return q.p.id === id; })[0]; if (!x) return viewResult();
    var p = x.p;
    var conds = x.res.map(function (r) { var m = r.ok === true ? ['ok', '✓'] : r.ok === false ? ['bad', '✕'] : ['q', '?']; return '<div class="cond"><span class="mark ' + m[0] + '" aria-label="' + (r.ok === true ? '충족' : r.ok === false ? '미충족' : '확인 필요') + '">' + m[1] + '</span><span style="flex:1 1 auto;min-width:0">' + r.label + '</span><span class="small" style="color:' + (r.ok === null ? 'var(--warn)' : 'var(--muted)') + ';font-weight:' + (r.ok === null ? 700 : 400) + '">' + esc(r.mine) + '</span></div>'; }).join('');

    return '<div class="stack" style="gap:22px">' + backLink('#result', '결과로 돌아가기') +

      '<p style="margin-top:12px"><b>1. 지원 대상</b><br>가. <mark>공고일 현재 만 19세 이상 39세 이하</mark> 무주택 청년으로서<br>나. <mark class="chg">서울시로 전입하였거나 서울시 내에서 이사한 자</mark><br>다. <mark>기준 중위소득 150% 이하</mark>인 자</p>' +
      '<p style="margin-top:12px"><b>2. 대상 주택</b><br><mark class="chg">임차보증금 2억 원 이하</mark>인 주택(전세·월세)</p><p style="margin-top:12px"><b>3. 지원 내용</b><br>부동산 중개보수 및 이사비 실비, <mark>1인 최대 40만 원</mark></p>' +
      '<p style="margin-top:12px"><b>4. 신청 기간 및 방법</b><br><mark>예산 소진 시까지</mark> 선착순, <mark>서울주거포털 온라인 신청</mark></p><p style="margin-top:12px"><b>5. 제출 서류</b><br><mark>임대차계약서, 중개보수 영수증, 이사비 영수증, 주민등록등본</mark></p></section>' +
      '<section class="card" style="flex:1 1 480px;min-width:0;padding:0;overflow:hidden" aria-label="자동 추출 항목"><div class="between" style="padding:14px 20px;border-bottom:1px solid var(--line)"><b>AI 자동 추출 항목</b><span class="small muted">수정하면 저장 시 반영돼요</span></div><div class="tbl-wrap"><table><thead><tr><th scope="col" style="padding-left:20px">항목</th><th scope="col">값</th><th scope="col" style="padding-right:20px">비교</th></tr></thead><tbody>' +
      rows.map(function (r, i) { return '<tr' + (r[2] ? ' class="changed"' : '') + '><th scope="row" style="padding-left:20px;white-space:nowrap">' + r[0] + '</th><td><input id="adm-' + i + '" aria-label="' + r[0] + '" value="' + r[1] + '">' + (r[2] ? '<div class="small muted" style="margin-top:4px">지난 공고: <s>' + r[2] + '</s></div>' : '') + '</td><td style="padding-right:20px;font-weight:' + (r[2] ? 700 : 400) + ';color:' + (r[2] ? 'var(--warn)' : 'var(--muted)') + '">' + (r[2] ? '변경' : '동일') + '</td></tr>'; }).join('') +
      '</tbody></table></div></section></div><p class="small muted">시연용 예시 공고와 예시 변경 이력이에요. 실제 운영에서는 수집한 공고 원문이 왼쪽에 표시돼요.</p></div>';
  }

  // ---------- router ----------
  var ROUTES = { home: viewHome, input: viewInput, result: viewResult, timeline: viewTimeline, 'detail-rent': function () { return viewDetail('rent'); }, 'detail-move': function () { return viewDetail('move'); }, docs: viewDocs, room: viewRoom, admin: viewAdmin };
  var lastRoute = '';
  function route() { var h = (location.hash || '').slice(1); return ROUTES[h] ? h : (h.indexOf('stage-') === 0 || h === 'alert' ? 'timeline' : 'home'); }
  function render(keepScroll) {
    var r = route(), active = document.activeElement && document.activeElement.id, y = window.scrollY;
    app.innerHTML = ROUTES[r]();
    document.querySelectorAll('[data-nav]').forEach(function (a) { var on = a.dataset.nav === r || (a.dataset.nav === 'result' && r.indexOf('detail') === 0); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    if (r === 'input') fillInputSide();
    if (keepScroll) { window.scrollTo(0, y); if (active) { var el = document.getElementById(active); if (el) el.focus({ preventScroll: true }); } }
    else if (r !== lastRoute) { var h = location.hash.slice(1); var target = h && document.getElementById(h); if (target && r === 'timeline' && h !== 'timeline') target.scrollIntoView(); else window.scrollTo(0, 0); }
    lastRoute = r;
  }
  window.addEventListener('hashchange', function () { var h = location.hash.slice(1); if (route() === lastRoute && h && document.getElementById(h)) { document.getElementById(h).scrollIntoView({ behavior: 'smooth' }); return; } render(false); });

  var toastEl = document.getElementById('toast'), toastT;
  function toast(msg) { toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { toastEl.hidden = true; }, 2600); }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.dataset.act, v = b.dataset.v;
    if (act === 'next') { S.step = Math.min(4, S.step + 1); save(); render(false); }
    else if (act === 'prev') { S.step = Math.max(1, S.step - 1); save(); render(false); }
    else if (act === 'gu') { S.gu = v; save(); render(true); }
    else if (act === 'reset') { var keep = S.step; S = JSON.parse(JSON.stringify(DEFAULT)); S.step = keep; save(); render(true); toast('예시 값으로 되돌렸어요.'); }
    else if (act === 'doc') { S.doc = v; save(); render(true); }
    else if (act === 'bed') { S.bed = v; save(); document.querySelectorAll('.bed-opt').forEach(function (x) { x.setAttribute('aria-pressed', x.dataset.v === v); }); updateRoom(); }
    else if (act === 'view') { S.view = v; save(); document.querySelectorAll('.seg button').forEach(function (x) { x.setAttribute('aria-pressed', x.dataset.v === v); }); updateRoom(); }
    else if (act === 'rot') { S.view = '3d'; S.rz = Math.max(10, Math.min(80, S.rz + +v)); save(); document.querySelectorAll('.seg button').forEach(function (x) { x.setAttribute('aria-pressed', x.dataset.v === '3d'); }); updateRoom(); }
    else if (act === 'approve') { S.approved = v; save(); render(true); toast(v === 'ok' ? '승인했어요.' : '반려했어요.'); }
    else if (act === 'toast') { toast(v); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset.act === 'task') { S.done[t.dataset.id] = t.checked; save(); render(true); }
    else if (t.dataset.act === 'furn') { S[t.dataset.v] = t.checked; save(); updateRoom(); }
    else if (t.dataset.act === 'file' && t.files && t.files[0]) { S.extraDocs.push(t.files[0].name); save(); render(true); toast('추가했어요. 시연 버전에서는 내용 확인을 하지 않아요.'); }
    else if (t.dataset.field) { setField(t); if (t.dataset.field === 'gu') render(true); }
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.dataset.room) { S[t.dataset.room] = parseFloat(t.value); save(); updateRoom(); }
    else if (t.dataset.field && t.type !== 'radio') { setField(t); }
  });
  function setField(t) {
    var k = t.dataset.field, v = t.value;
    if (t.hasAttribute('data-num')) { var n = parseInt(String(v).replace(/[^0-9]/g, ''), 10); v = isNaN(n) ? 0 : n; }
    S[k] = v; save(); fillInputSide();
  }
  document.addEventListener('submit', function (e) { if (e.target.dataset.form === 'alert') { e.preventDefault(); toast('알림을 설정했어요. 시연 버전에서는 실제 알림을 보내지 않아요.'); } });

  render(false);
})();
</script>
