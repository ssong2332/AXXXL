<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>운영자 콘솔 · 자취 계약 내비</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<script src="rules-core.js" defer></script>
<script src="rules/seed.js" defer></script>
<script src="rules/samples.js" defer></script>
<script src="coach-core.js" defer></script>
<script src="assistant-core.js" defer></script>
<script src="eval-core.js" defer></script>
<script src="rules/evals.js" defer></script>
<style>
/* 운영자 콘솔 — 이용자 화면(app.html)과 같은 색·글꼴, 정보 밀도는 더 높게 */
:root {
  --bg: #F7F7F4; --surface: #FFFFFF; --fill: #F0F0EB; --fill-2: #E5E5DF;
  --ink: #17171A; --ink-2: #44444A; --ink-3: #74747B;
  --line: #E2E2DC; --hair: rgba(23,23,26,0.08);
  --brand-tint: #E6F1EC; --brand-text: #0D6650;
  --due: #C2410C; --due-tint: #FCEFE6; --due-text: #A6380B;
  --bad-tint: #FBEAEA; --bad-text: #A12A2A;
  --mark: #FFF1B8; --mark-on: #FFD84D;
  --r: 12px; --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111112; --surface: #1A1A1C; --fill: #232326; --fill-2: #2D2D31; --ink: #EDEDEA; --ink-2: #C4C4C0; --ink-3: #95958F; --line: #2E2E32; --hair: rgba(255,255,255,0.08);
  --brand-tint: #14302A; --brand-text: #6FCDB2; --due: #F08A4B; --due-tint: #36231A; --due-text: #F5A673; --bad-tint: #3A1E1E; --bad-text: #F19A9A; --mark: #4A4120; --mark-on: #7A6A1E; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111112; --surface: #1A1A1C; --fill: #232326; --fill-2: #2D2D31; --ink: #EDEDEA; --ink-2: #C4C4C0; --ink-3: #95958F; --line: #2E2E32; --hair: rgba(255,255,255,0.08);
  --brand-tint: #14302A; --brand-text: #6FCDB2; --due: #F08A4B; --due-tint: #36231A; --due-text: #F5A673; --bad-tint: #3A1E1E; --bad-text: #F19A9A; --mark: #4A4120; --mark-on: #7A6A1E; color-scheme: dark }
* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.55; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased }
h1, h2, h3, p { margin: 0 }
a { color: var(--brand-text) }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--brand-text); outline-offset: 2px }
.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh }
.side { position: sticky; top: 0; height: 100vh; padding: 18px 12px; border-right: 1px solid var(--hair); background: var(--surface); display: flex; flex-direction: column; gap: 4px }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; font-weight: 800; letter-spacing: -0.03em }
.brand i { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--ink); color: var(--surface); font-style: normal; font-size: 13px }
.brand small { display: block; font-size: 11px; font-weight: 600; color: var(--ink-3) }
.nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 10px; border-radius: 9px; color: var(--ink-2); text-decoration: none; font-weight: 600 }
.nav:hover { background: var(--fill) }
.nav[aria-current="page"] { background: var(--fill); color: var(--ink) }
.nav .n { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--ink); color: var(--surface); font-size: 11px; display: inline-grid; place-items: center }
.nav .n.z { background: var(--fill-2); color: var(--ink-3) }
.side .foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 10px 6px 0; border-top: 1px solid var(--hair); font-size: 12px; color: var(--ink-3) }
main { padding: 24px 28px 60px; min-width: 0 }
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px }
.top h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.045em; line-height: 1.2 }
.eyebrow { font-size: 12px; color: var(--ink-3); font-weight: 600; margin-bottom: 4px }
.card { background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r); padding: 18px; min-width: 0 }
.card h2 { font-size: 15px; font-weight: 750; letter-spacing: -0.03em }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap }
.stack { display: flex; flex-direction: column; gap: 12px }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(12, minmax(0, 1fr)) }
.c3q { grid-column: span 3 } .c4 { grid-column: span 4 } .c5 { grid-column: span 5 } .c6 { grid-column: span 6 } .c7 { grid-column: span 7 } .c8 { grid-column: span 8 } .c12 { grid-column: span 12 }
.muted { color: var(--ink-3) } .s12 { font-size: 12px } .s13 { font-size: 13px } .b { font-weight: 700 }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 0 14px; border: 0; border-radius: 9px; background: var(--ink); color: var(--surface); font-weight: 700; cursor: pointer; white-space: nowrap; text-decoration: none }
.btn:disabled { opacity: .4; cursor: not-allowed }
.btn.ghost { background: var(--fill); color: var(--ink) }
.btn.line { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line) }
.btn.bad { background: transparent; color: var(--bad-text); box-shadow: inset 0 0 0 1px var(--line) }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: 12px; border-radius: 8px }
.inp, textarea.inp, select.inp { width: 100%; min-height: 38px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface) }
textarea.inp { resize: vertical; line-height: 1.5 }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-3); font-weight: 600 }
.badge { display: inline-flex; align-items: center; gap: 4px; height: 21px; padding: 0 7px; border-radius: 6px; font-size: 11.5px; font-weight: 650; white-space: nowrap; background: var(--fill); color: var(--ink-2) }
.badge.ok { background: var(--brand-tint); color: var(--brand-text) }
.badge.due { background: var(--due-tint); color: var(--due-text) }
.badge.bad { background: var(--bad-tint); color: var(--bad-text) }
.badge.ink { background: var(--ink); color: var(--surface) }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; background: var(--fill); color: var(--ink-2); font-size: 13px }
.banner.due { background: var(--due-tint); color: var(--due-text) }
.banner.ok { background: var(--brand-tint); color: var(--brand-text) }
.banner.bad { background: var(--bad-tint); color: var(--bad-text) }
table { width: 100%; border-collapse: collapse }
th, td { text-align: left; vertical-align: top; padding: 9px 8px; border-top: 1px solid var(--hair); font-size: 13px }
thead th { border-top: 0; color: var(--ink-3); font-size: 12px; font-weight: 650 }
tr.chg td, tr.chg th { background: var(--due-tint) }
.list-item { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-top: 1px solid var(--hair); text-decoration: none; color: inherit }
.list-item:first-child { border-top: 0 }
.list-item:hover { background: var(--fill) }
.list-item .t { font-weight: 700 }
.empty { padding: 28px 10px; text-align: center; color: var(--ink-3) }
/* 검수 화면 */
.review { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 14px; align-items: start }
.src { position: sticky; top: 14px; max-height: calc(100vh - 28px); overflow: auto; padding: 0 }
.src-h { position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--hair) }
.src-body { padding: 10px 6px 14px; font-size: 13.5px; line-height: 1.7 }
.ln { display: block; padding: 0 10px; border-radius: 6px; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; min-height: 1.7em }
.ln.ev { background: var(--mark); cursor: pointer }
.ln.on { background: var(--mark-on); box-shadow: inset 3px 0 0 var(--ink) }
.fld { display: grid; grid-template-columns: 150px minmax(0, 1fr) 92px; gap: 10px; padding: 12px 6px; border-top: 1px solid var(--hair); align-items: start }
.fld:first-child { border-top: 0 }
.fld.need { background: linear-gradient(90deg, var(--due-tint), transparent 70%) }
.fld.focus { box-shadow: inset 3px 0 0 var(--ink) }
.fld .lab { font-weight: 700; font-size: 13px }
.fld .lab small { display: block; color: var(--ink-3); font-weight: 500; font-size: 11.5px }
.quote { margin-top: 6px; padding: 6px 9px; border-left: 2px solid var(--line); color: var(--ink-2); font-size: 12.5px; cursor: pointer; border-radius: 0 6px 6px 0; background: var(--fill) }
.quote.none { cursor: default; color: var(--ink-3); font-style: italic }
.flags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px }
.ack { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; cursor: pointer; padding-top: 6px }
.ack input { width: 18px; height: 18px; accent-color: var(--ink) }
.grp { font-size: 12px; font-weight: 750; color: var(--ink-3); padding: 14px 6px 4px; letter-spacing: 0.02em }
.sticky-bar { position: sticky; bottom: 0; z-index: 3; margin-top: 14px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: space-between; box-shadow: 0 -6px 20px rgba(0,0,0,.06) }
.progress { height: 6px; border-radius: 3px; background: var(--fill-2); overflow: hidden; min-width: 120px; flex: 1 1 120px; max-width: 260px }
.progress span { display: block; height: 100%; background: var(--brand-text) }
.pv { border: 1px dashed var(--line); border-radius: 10px; padding: 14px }
.cond { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; font-size: 13px }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { display: inline-flex; align-items: center; min-height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; cursor: pointer }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--hair); margin-bottom: 14px; overflow-x: auto }
.tab { padding: 9px 12px; border: 0; background: none; font-weight: 650; color: var(--ink-3); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink) }
.spin { width: 16px; height: 16px; border: 2px solid var(--fill-2); border-top-color: var(--ink); border-radius: 50%; animation: sp 0.8s linear infinite; display: inline-block }
@keyframes sp { to { transform: rotate(360deg) } }
.selbar { position: fixed; z-index: 20; left: 50%; bottom: 18px; transform: translateX(-50%); max-width: min(560px, calc(100vw - 32px)); padding: 10px 14px; border-radius: 12px; background: var(--ink); color: var(--surface); font-size: 13px; display: flex; gap: 10px; align-items: center }
.selbar span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 300px }
#toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%) translateY(-120%); z-index: 30; padding: 10px 16px; border-radius: 10px; background: var(--ink); color: var(--surface); font-weight: 650; transition: transform .2s ease; max-width: calc(100vw - 32px) }
#toast.on { transform: translateX(-50%) translateY(0) }
.login { max-width: 420px; margin: 12vh auto 0; padding: 0 16px }
.kv { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 4px 12px; font-size: 13px }
.kv dt { color: var(--ink-3) } .kv dd { margin: 0; white-space: pre-wrap }
pre.srcbox { white-space: pre-wrap; font-family: inherit; font-size: 12.5px; background: var(--fill); padding: 12px; border-radius: 8px; max-height: 320px; overflow: auto; margin: 0 }
.mtabs { display: none }
@media (max-width: 960px) {
  .shell { grid-template-columns: minmax(0, 1fr) }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; padding: 10px 12px; border-right: 0; border-bottom: 1px solid var(--hair) }
  .brand { padding: 4px 8px; width: 100% }
  .side .foot { display: none }
  .nav { padding: 6px 9px; font-size: 13px }
  main { padding: 16px 16px 60px }
  .review { grid-template-columns: minmax(0, 1fr) }
  .src { position: static; max-height: 46vh }
  .grid > * { grid-column: span 12 }
  .fld { grid-template-columns: minmax(0, 1fr) }
  .kv { grid-template-columns: minmax(0, 1fr) }
}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';
  var J = window.JachwiRules, SEED = window.JACHWI_SEED, SAMPLES = window.JACHWI_SAMPLES || [];
  var root = document.getElementById('root');
  var LOCAL = 'jachwi-admin-local', MISS = 'jachwi-coach-miss';
  function ls(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
  function ss(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }
  function clone(x) { return JSON.parse(JSON.stringify(x)); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function when(iso) { if (!iso) return ''; var d = new Date(iso); if (isNaN(d)) return iso; return (d.getMonth() + 1) + '.' + d.getDate() + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  var tt; function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(function () { t.classList.remove('on'); }, 2400); }

  // ---------- 상태 ----------
  // mode: 'server'(운영자 코드로 공유 저장소) | 'local'(이 브라우저 연습 모드) | 'login'
  var A = { mode: 'boot', token: ss('jachwi-admin-token') || '', name: ls('jachwi-admin-name') || '', storage: '', ai: false, st: null, busy: '', focus: '', sel: '', tab: {}, cardEdit: null, test: null, err: '', serverConfigured: false };
  function localState() {
    var s = ls(LOCAL);
    if (!s || !s.published) s = { published: clone(SEED), drafts: { items: [] }, unanswered: { items: [] } };
    var miss = ls(MISS) || [];
    miss.forEach(function (m) { if (!s.unanswered.items.some(function (x) { return x.id === m.id; })) s.unanswered.items.unshift(m); });
    return s;
  }
  function saveLocal() { ls(LOCAL, A.st); ls(MISS, (ls(MISS) || []).filter(function (m) { return A.st.unanswered.items.some(function (x) { return x.id === m.id; }); })); }
  function api(method, path, body) {
    return fetch(path, { method: method, headers: { 'content-type': 'application/json', 'x-admin-token': A.token }, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().catch(function () { return { ok: false, error: '응답을 읽지 못했어요.' }; }).then(function (j) { j._status = r.status; return j; }); });
  }
  function boot() {
    api('GET', '/api/admin').then(function (j) {
      if (j.ok) { A.mode = 'server'; A.st = { published: j.published, drafts: j.drafts, unanswered: j.unanswered }; A.storage = j.storage; A.ai = j.ai; A.serverConfigured = true; }
      else if (j._status !== 401) { startLocal(); }
      else { A.serverConfigured = true; A.mode = 'login'; if (A.token) A.err = j.error || ''; A.token = ''; ss('jachwi-admin-token', null); }
      render();
    }).catch(function () { startLocal(); render(); });
    fetch('/api/rules').then(function (r) { return r.json(); }).then(function (j) { if (j && j.ok) { A.ai = A.ai || j.ai; render(true); } }).catch(function () {});
  }
  function startLocal() { A.mode = 'local'; A.storage = 'local'; A.st = localState(); }
  // 모든 변경은 같은 규칙(applyOp)으로: 서버면 서버가, 연습 모드면 브라우저가 처리
  function op(o, done) {
    o.reviewer = A.name || '운영자';
    if (A.mode === 'server') {
      A.busy = o.op; render(true);
      return api('POST', '/api/admin', o).then(function (j) {
        A.busy = '';
        if (!j.ok) { toast(j.error || '저장하지 못했어요.'); render(true); return; }
        A.st = { published: j.published, drafts: j.drafts, unanswered: j.unanswered };
        if (done) done(j.result); render(true);
      }).catch(function () { A.busy = ''; toast('서버에 연결하지 못했어요.'); render(true); });
    }
    var r = J.applyOp(A.st, o, A.name || '운영자');
    if (!r.ok) { toast(r.error); return; }
    saveLocal(); if (done) done(r.result); render(true);
  }

  // ---------- 화면 공통 ----------
  function route() { var h = (location.hash || '#queue').slice(1).split('/'); return { r: h[0] || 'queue', id: decodeURIComponent(h[1] || '') }; }
  function drafts() { return (A.st && A.st.drafts.items) || []; }
  function notices() { return (A.st && A.st.published.notices) || {}; }
  function nname(rec) { return rec && rec.fields && rec.fields.name ? J.show('name', J.normalize('name', rec.fields.name.value)) : '(이름 없음)'; }
  function prevOf(d) { return d.noticeId && notices()[d.noticeId] ? notices()[d.noticeId] : null; }
  function modeBadge() {
    if (A.mode === 'server') return A.storage === 'blob' ? '<span class="badge ok">공유 저장소 연결</span>' : '<span class="badge due" title="BLOB_READ_WRITE_TOKEN이 없어 서버 메모리에만 저장돼요">서버 메모리 (재시작하면 사라짐)</span>';
    return '<span class="badge due">이 브라우저 연습 모드</span>';
  }
  function shell(main) {
    var R = route(), nd = drafts().filter(function (d) { return d.status !== 'rejected'; }).length, nm = A.st ? A.st.unanswered.items.length : 0, nn = Object.keys(notices()).length, nc = A.st ? A.st.published.cards.length : 0;
    var nav = [['queue', '검수함', nd, true], ['new', '새 공고 추출'], ['published', '승인된 공고', nn], ['cards', '코치 지식', nc], ['missed', '답 못 한 질문', nm, true], ['quality', '품질 평가'], ['prompts', '시스템 프롬프트'], ['log', '변경 기록']];
    var cur = { review: 'queue', notice: 'published' }[R.r] || R.r;
    return '<div class="shell"><nav class="side" aria-label="운영자 메뉴"><div class="brand"><i>내비</i><div>운영자 콘솔<small>공고 검수 · AI 코치</small></div></div>' +
      nav.map(function (n) { return '<a class="nav" href="#' + n[0] + '"' + (cur === n[0] ? ' aria-current="page"' : '') + '><span>' + n[1] + '</span>' + (n[2] !== undefined ? '<span class="n' + (n[3] && n[2] ? '' : ' z') + '">' + n[2] + '</span>' : '') + '</a>'; }).join('') +
      '<div class="foot">' + modeBadge() + (A.ai ? '<span class="badge ok">Claude 연결됨 · 내장 AI 대기</span>' : '<span class="badge ok" title="외부 API 없이 이 기기 안에서 동작해요">내장 AI로 동작 중</span>') +
      '<label class="field">검수자 이름<input class="inp" data-name value="' + esc(A.name) + '" placeholder="예: 이성준" maxlength="20"></label>' +
      (A.mode === 'server' ? '<button class="btn sm line" data-act="logout">잠그기</button>' : (A.serverConfigured ? '<button class="btn sm line" data-act="login">운영자 코드로 들어가기</button>' : '') + '<button class="btn sm line" data-act="resetlocal">연습 내용 처음으로</button>') +
      '<a class="s12" href="app.html#support">이용자 화면 보기 ↗</a></div></nav><main id="main">' + main + '</main></div>' + (A.sel ? '<div class="selbar"><span>선택: “' + esc(A.sel) + '”</span><span class="s12" style="opacity:.75">항목의 [선택 문장을 근거로]를 누르세요</span></div>' : '');
  }
