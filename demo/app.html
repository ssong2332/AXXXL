<style>
/* ============================================================
   자취 내비 디자인 — 계약 후 서비스
   - 강조색 하나(내비 보라), 기한만 주황으로 구분
   - 흰 카드 + 헤어라인, 그림자 없음
   - PC: 왼쪽 사이드바 / 휴대폰: 위 바 + 아래 탭바
   ============================================================ */
:root {
  --bg: #F5F5F9; --surface: #FFFFFF; --fill: #F1F1F6; --fill-2: #E9E9F0;
  --ink: #16171F; --ink-2: #3D3F4D; --ink-3: #6C6F7D;
  --line: #E4E4EC; --hair: rgba(22,23,31,0.07);
  --brand: #5B4CDB; --brand-ink: #FFFFFF; --brand-tint: #EEECFC; --brand-text: #4F40CF; --brand-deep: #2E2580;
  --due: #D9480F; --due-tint: #FFF0E6; --due-text: #B53A0A;
  --no: #8A8D99; --no-tint: #F1F1F4;
  --focus: #7A6DF0;
  --r-card: 20px; --r-in: 14px; --r-btn: 12px;
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E0E13; --surface: #17171F; --fill: #21212B; --fill-2: #2A2A35;
  --ink: #EDEDF3; --ink-2: #C3C4CF; --ink-3: #9396A4;
  --line: #2C2C38; --hair: rgba(255,255,255,0.08);
  --brand: #6C5FF0; --brand-ink: #FFFFFF; --brand-tint: #25214A; --brand-text: #A99FFF; --brand-deep: #241E5C;
  --due: #FF8A4C; --due-tint: #3A2416; --due-text: #FFB089;
  --no: #8A8D99; --no-tint: #23232C; --focus: #A99FFF; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E0E13; --surface: #17171F; --fill: #21212B; --fill-2: #2A2A35;
  --ink: #EDEDF3; --ink-2: #C3C4CF; --ink-3: #9396A4;
  --line: #2C2C38; --hair: rgba(255,255,255,0.08);
  --brand: #6C5FF0; --brand-ink: #FFFFFF; --brand-tint: #25214A; --brand-text: #A99FFF; --brand-deep: #241E5C;
  --due: #FF8A4C; --due-tint: #3A2416; --due-text: #FFB089;
  --no: #8A8D99; --no-tint: #23232C; --focus: #A99FFF; color-scheme: dark }

* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.55; letter-spacing: -0.012em; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased }
h1, h2, h3, p { margin: 0 }
h1, h2, h3 { letter-spacing: -0.03em; text-wrap: balance }
a { color: var(--brand-text); text-decoration: none }
a:hover { text-decoration: underline }
button, input, select { font: inherit; color: inherit }
[hidden] { display: none !important }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 8px }
svg.i { width: 20px; height: 20px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round }
svg.i.sm { width: 16px; height: 16px }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 244px minmax(0, 1fr); min-height: 100vh }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 2px; padding: 22px 14px 18px; background: var(--surface); border-right: 1px solid var(--hair) }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 22px; color: var(--ink); text-decoration: none !important }
.brand-mark { width: 34px; height: 34px; border-radius: 11px; background: var(--brand); color: var(--brand-ink); display: inline-flex; align-items: center; justify-content: center }
.brand b { font-size: 17px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.15 }
.brand small { display: block; font-size: 11px; color: var(--ink-3); font-weight: 500; letter-spacing: 0 }
.nav { display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 12px; border-radius: 12px; color: var(--ink-2); font-weight: 500; text-decoration: none !important }
.nav:hover { background: var(--fill) }
.nav[aria-current="page"] { background: var(--brand-tint); color: var(--brand-text); font-weight: 700 }
.nav .cnt { margin-left: auto; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--due); color: #fff; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px }
.privacy { display: flex; gap: 8px; align-items: flex-start; padding: 12px; border-radius: 14px; background: var(--fill); color: var(--ink-3); font-size: 12px; line-height: 1.5 }
.privacy svg { margin-top: 1px; color: var(--ink-2) }
.side-foot a.small-link { font-size: 12px; color: var(--ink-3); padding: 0 12px }

.topbar, .tabbar { display: none }
.main { min-width: 0; width: 100%; max-width: 1200px; padding: 28px clamp(16px, 3.2vw, 44px) 72px }

@media (max-width: 899px) {
  .shell { display: block }
  .side { display: none }
  .topbar { display: flex; position: sticky; top: 0; z-index: 20; align-items: center; justify-content: space-between; gap: 12px; height: calc(56px + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--surface) 88%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--hair) }
  .topbar .brand { padding: 0 }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--surface) 92%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--hair) }
  .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 50px; border-radius: 12px; color: var(--ink-3); font-size: 11px; font-weight: 600; text-decoration: none !important; position: relative }
  .tab[aria-current="page"] { color: var(--brand-text) }
  .tab .cnt { position: absolute; top: 4px; left: 54%; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--due); color: #fff; font-size: 10px; display: inline-flex; align-items: center; justify-content: center }
  .main { padding: 20px 16px calc(96px + env(safe-area-inset-bottom, 0px)) }
}

/* ---------- common ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 20px; margin-bottom: 22px }
.page-head h1 { font-size: clamp(26px, 3.6vw, 34px); font-weight: 800; line-height: 1.25 }
.eyebrow { font-size: 13px; color: var(--ink-3); font-weight: 500; margin-bottom: 6px }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px }
.c4 { grid-column: span 4 } .c5 { grid-column: span 5 } .c6 { grid-column: span 6 } .c7 { grid-column: span 7 } .c8 { grid-column: span 8 } .c12 { grid-column: 1 / -1 }
@media (max-width: 1099px) { .c4, .c5, .c6, .c7, .c8 { grid-column: 1 / -1 } }
.card { background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r-card); padding: 22px; min-width: 0 }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px }
.card-h h2 { font-size: 17px; font-weight: 700 }
.card-h .more { font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 2px }
.muted { color: var(--ink-3) } .sub { color: var(--ink-2) }
.s13 { font-size: 13px } .s12 { font-size: 12px }
.stack { display: flex; flex-direction: column; gap: 12px }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px }
.split { display: flex; align-items: center; justify-content: space-between; gap: 12px }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border: 0; border-radius: var(--r-btn); background: var(--brand); color: var(--brand-ink); font-size: 15px; font-weight: 700; cursor: pointer; white-space: nowrap; text-decoration: none !important; transition: transform .12s ease, filter .12s ease }
.btn:hover { filter: brightness(1.06) }
.btn:active { transform: scale(0.97) }
.btn.ghost { background: var(--fill); color: var(--ink) }
.btn.line { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line) }
.btn.sm { min-height: 38px; padding: 0 12px; border-radius: 10px; font-size: 13px }
.btn.block { width: 100% }
.icon-btn { width: 40px; height: 40px; border: 0; border-radius: 12px; background: var(--fill); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: 0 0 auto }
.icon-btn:active { transform: scale(0.95) }

.badge { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 7px; font-size: 12px; font-weight: 700; white-space: nowrap; background: var(--fill); color: var(--ink-2) }
.badge.brand { background: var(--brand-tint); color: var(--brand-text) }
.badge.due { background: var(--due-tint); color: var(--due-text) }
.badge.solid { background: var(--brand); color: var(--brand-ink) }
.badge.no { background: var(--no-tint); color: var(--no) }

.banner { display: flex; gap: 10px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r-in); background: var(--brand-tint); color: var(--brand-text); font-size: 14px }
.banner.due { background: var(--due-tint); color: var(--due-text) }
.banner b { font-weight: 700 }
.banner a { color: inherit; text-decoration: underline; text-underline-offset: 2px }

.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 12px; background: var(--fill) }
.seg button { min-height: 34px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: var(--ink-3); font-size: 13px; font-weight: 600; cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--hair) }

/* round checkbox */
.chk { appearance: none; -webkit-appearance: none; width: 24px; height: 24px; margin: 0; flex: 0 0 auto; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); cursor: pointer; display: inline-grid; place-content: center; transition: background .12s }
.chk:checked { background: var(--brand); border-color: var(--brand) }
.chk:checked::after { content: ""; width: 11px; height: 6px; border: 2.4px solid #fff; border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg) }
/* switch */
.sw { appearance: none; -webkit-appearance: none; width: 44px; height: 26px; margin: 0; flex: 0 0 auto; border-radius: 13px; background: var(--fill-2); position: relative; cursor: pointer; transition: background .15s }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2) }
.sw:checked { background: var(--brand) }
.sw:checked::after { transform: translateX(18px) }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0 }
.field > span { font-size: 13px; color: var(--ink-3); font-weight: 600 }
.inp { width: 100%; min-width: 0; min-height: 46px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 15px }
.inp:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-tint) }
.unit { position: relative } .unit .inp { padding-right: 46px } .unit em { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-style: normal; color: var(--ink-3); font-size: 14px }

/* ---------- task item ---------- */
.task { display: flex; gap: 12px; align-items: flex-start; padding: 14px 0; border-top: 1px solid var(--hair) }
.task:first-child { border-top: 0; padding-top: 4px }
.task .num { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--surface); font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center }
.task .body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 5px }
.task .t { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 10px }
.task label { font-size: 16px; font-weight: 700; cursor: pointer; letter-spacing: -0.025em }
.task .d { font-size: 14px; color: var(--ink-2) }
.task .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.pill { display: inline-flex; gap: 6px; align-items: center; min-height: 28px; padding: 0 10px; border-radius: 8px; background: var(--fill); font-size: 12px; color: var(--ink-2) }
.pill b { color: var(--ink); font-weight: 700 }
.task .act { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 2px }
.src { font-size: 12px; color: var(--ink-3) }
a.src { color: var(--ink-3); text-decoration: underline; text-underline-offset: 2px }
.task.done label { color: var(--ink-3); text-decoration: line-through }
.task.done .d { color: var(--ink-3) }

/* ---------- home ---------- */
.dday { background: var(--brand); color: var(--brand-ink); border: 0; display: flex; flex-direction: column; gap: 18px; position: relative; overflow: hidden }
.dday::after { content: ""; position: absolute; right: -40px; top: -40px; width: 180px; height: 180px; border-radius: 50%; background: rgba(255,255,255,0.08) }
.dday .lbl { font-size: 13px; font-weight: 600; opacity: .85 }
.dday .big { font-size: 56px; font-weight: 800; letter-spacing: -0.05em; line-height: 1 }
.dday .big small { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; margin-left: 6px; opacity: .9 }
.dday dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; position: relative; z-index: 1 }
.dday dt { opacity: .75 } .dday dd { margin: 0; font-weight: 700; text-align: right }
.dday .edit { position: relative; z-index: 1; align-self: flex-start; color: var(--brand-ink); font-size: 13px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px }
.now-card { border: 2px solid var(--brand) }
.journey { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px }
.journey li { display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.journey .bar { height: 6px; border-radius: 3px; background: var(--fill-2) }
.journey li.done .bar { background: var(--brand) }
.journey li.now .bar { background: linear-gradient(90deg, var(--brand) 50%, var(--fill-2) 50%) }
.journey b { font-size: 13px; font-weight: 700; color: var(--ink-3); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.journey li.done b, .journey li.now b { color: var(--ink) }
.journey li.now b { color: var(--brand-text) }
.journey span { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.journey li.skip { opacity: .5 }
@media (max-width: 640px) {
  .journey { grid-template-columns: repeat(7, minmax(64px, 1fr)); overflow-x: auto; padding-bottom: 4px }
}
.ev-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--hair) }
.ev-row:first-child { border-top: 0; padding-top: 0 }
.date-blk { flex: 0 0 44px; height: 46px; border-radius: 12px; background: var(--fill); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15 }
.date-blk b { font-size: 16px; font-weight: 800 } .date-blk span { font-size: 11px; color: var(--ink-3) }
.date-blk.today { background: var(--brand); color: var(--brand-ink) } .date-blk.today span { color: var(--brand-ink); opacity: .85 }
.ev-row .what { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column }
.ev-row .what b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.amt { font-weight: 800; white-space: nowrap } .amt.in { color: var(--brand-text) }
.money-big { font-size: 30px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.2 }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--hair); font-size: 14px }
.kv:first-child { border-top: 0 }
.prog { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-top: 1px solid var(--hair) }
.prog:first-child { border-top: 0; padding-top: 0 }
.prog-ic { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 12px; background: var(--brand-tint); color: var(--brand-text); display: inline-flex; align-items: center; justify-content: center }
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.chip { min-height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer }
.chip[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-tint); color: var(--brand-text) }
.bubble-q { align-self: flex-end; max-width: 88%; padding: 10px 14px; border-radius: 16px 16px 4px 16px; background: var(--brand); color: var(--brand-ink); font-weight: 600 }
.bubble-a { align-self: flex-start; max-width: 100%; padding: 14px 16px; border-radius: 16px 16px 16px 4px; background: var(--fill); display: flex; flex-direction: column; gap: 8px }
.ask { display: flex; gap: 8px }
.ask .inp { flex: 1 1 auto }
.doc-li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--hair); font-size: 14px }
.doc-li:first-child { border-top: 0; padding-top: 0 }
.demo-tools { display: flex; flex-direction: column; align-items: flex-end; gap: 6px }
@media (max-width: 899px) { .demo-tools { align-items: flex-start } }

/* ---------- timeline ---------- */
.rail { position: relative; display: flex; flex-direction: column; gap: 16px }
.stage { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 18px; position: relative }
.stage::before { content: ""; position: absolute; left: 131px; top: 26px; bottom: -22px; width: 2px; background: var(--line) }
.stage:last-child::before { display: none }
.stage-when { text-align: right; padding-top: 18px }
.stage-when b { display: block; font-size: 14px; font-weight: 800 }
.stage-when span { font-size: 12px; color: var(--ink-3) }
.stage .node { position: absolute; left: 125px; top: 20px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 3px solid var(--line); z-index: 1 }
.stage.done .node { background: var(--brand); border-color: var(--brand) }
.stage.now .node { border-color: var(--brand); box-shadow: 0 0 0 5px var(--brand-tint) }
.stage .card { margin-left: 14px }
.stage.now .card { border: 2px solid var(--brand) }
@media (max-width: 640px) {
  .stage { grid-template-columns: minmax(0, 1fr); gap: 6px; padding-left: 22px }
  .stage::before { left: 6px; top: 8px; bottom: -22px }
  .stage .node { left: 0; top: 4px }
  .stage-when { text-align: left; padding-top: 0; display: flex; gap: 8px; align-items: baseline }
  .stage .card { margin-left: 0 }
}
.progress-line { height: 8px; border-radius: 4px; background: var(--fill-2); overflow: hidden }
.progress-line span { display: block; height: 100%; background: var(--brand); border-radius: 4px }

/* ---------- calendar ---------- */
.cal-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start }
@media (max-width: 1099px) { .cal-wrap { grid-template-columns: minmax(0, 1fr) } }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px }
@media (max-width: 640px) { .stats { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) } .stats .stat:last-child { grid-column: 1 / -1 } }
.stat { background: var(--surface); border: 1px solid var(--hair); border-radius: 18px; padding: 16px 18px; min-width: 0 }
.stat .k { font-size: 13px; color: var(--ink-3); font-weight: 600 }
.stat .v { font-size: 24px; font-weight: 800; letter-spacing: -0.04em; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }

   1 색: 보라·그라데이션 제거 → 먹색 버튼 + 짙은 청록 강조 하나, 기한만 주황
   2 바탕: 차가운 라벤더 → 따뜻한 종이색
   3 모양: 둥근 정도 20 → 12, 알약 칩 → 각진 칩

      if (k === 'name') v = String(v).trim().slice(0, 20) || bb.name;
      bb[k] = v; save(); render(true);
    }
    else if (d.field) { setField(t); render(true); }
  });
  document.addEventListener('input', function (e) { var t = e.target; if (t.id === 'q') updateSearch(t.value); else if (t.dataset.field && t.hasAttribute('data-num')) setField(t); });
  function setField(t) {
    var k = t.dataset.field, v = t.value;
    if (t.hasAttribute('data-num')) { var n = parseInt(String(v).replace(/[^0-9]/g, ''), 10); v = isNaN(n) ? 0 : n; }
    if ((k === 'contract' || k === 'move') && !/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
    if (k === 'nick' || k === 'addr') v = String(v).slice(0, k === 'nick' ? 10 : 20);
    S[k] = v; save();
  }
  document.addEventListener('submit', function (e) {
    var f = e.target.dataset.form; if (!f) return; e.preventDefault();
    if (f === 'geo') { var gq = e.target.querySelector('input').value.trim(); if (gq.length >= 2) geoSearch(gq); else toast('두 글자 이상 입력해 주세요.'); return; }
    if (f === 'evadd') { var fe = new FormData(e.target), et = String(fe.get('title') || '').trim().slice(0, 30), edt = String(fe.get('date') || ''); if (!et || !/^\d{4}-\d{2}-\d{2}$/.test(edt)) { toast('날짜와 내용을 넣어 주세요.'); return; } S.events = S.events || []; S.events.push({ id: 'ev' + Date.now(), date: edt, time: /^\d{2}:\d{2}$/.test(String(fe.get('time'))) ? String(fe.get('time')) : '', title: et }); S.calSel = edt; save(); render(true); toast('일정을 추가했어요. 폰 연동 탭에서 휴대폰 캘린더에도 넣을 수 있어요.'); return; }
    if (f === 'coach') { var q = e.target.querySelector('input').value.trim(); if (q) { S.chat.push(q.slice(0, 60)); if (S.chat.length > 20) S.chat.shift(); save(); render(true); var inp = app.querySelector('form[data-form=coach] input'); if (inp) inp.focus({ preventScroll: true }); } }
    else if (f === 'billadd') {
      var fd = new FormData(e.target), name = String(fd.get('name') || '').trim().slice(0, 20), amt = parseInt(String(fd.get('amount') || '').replace(/[^0-9]/g, ''), 10);
      if (!name || !amt) { toast('이름과 금액을 넣어 주세요.'); return; }
      S.bills.push({ id: 'c' + Date.now(), name: name, kind: fd.get('kind') === 'in' ? 'in' : 'out', amount: amt, day: +fd.get('day') || 1, every: 1, on: true, start: ymStr(ym(today)) });
      save(); render(true); toast(name + ' 항목을 추가했어요.');
    }
  });

  function boot() {
    var h = location.hash;
    if (h.indexOf('#phone=') === 0) { PHONE_D = h.slice(7).replace(/[^\w-]/g, ''); S.calTab = 'phone'; history.replaceState(null, '', location.pathname + location.search + '#calendar'); }
    if (h.indexOf('#import=') === 0) {
      var dd = h.slice(8).replace(/[^\w-]/g, ''); history.replaceState(null, '', location.pathname + location.search + '#home');
      decodePayload(dd).then(function (o) { if (o && typeof o === 'object' && confirm('PC에서 보낸 계약 정보·일정·집 위치로 이 기기 내용을 바꿀까요?')) { Object.keys(exportObj()).forEach(function (k) { if (k in o) S[k] = o[k]; }); save(); PC.k = ''; loadPlaces(); render(false); toast('PC에서 보낸 정보로 바꿨어요.'); } }).catch(function () { toast('QR 정보를 읽지 못했어요.'); });
    }
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function () {});
    render(false);
  }
  boot();
});
</script>
