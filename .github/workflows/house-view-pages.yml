# 집 보기 시연판(house-view/web)을 GitHub Pages로 배포한다.
# 레포 Settings → Pages → Source를 "GitHub Actions"로 바꿔야 동작한다.
name: house-view Pages

on:
  push:
    branches: [main]
    paths:
      - "house-view/**"
      - ".github/workflows/house-view-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 단위 테스트
        working-directory: house-view
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: house-view/web
      - id: deployment
        uses: actions/deploy-pages@v4
